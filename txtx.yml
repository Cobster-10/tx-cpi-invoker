version: "1"

# Default runbook when you run 'surfpool run'
main: deployment

environments:
  localnet:
    network_id: localnet
    rpc_api_url: "http://127.0.0.1:8899"
    payer: "~/.config/solana/id.json"
  devnet:
    network_id: devnet
    rpc_api_url: "https://api.devnet.solana.com"
    payer: "~/.config/solana/id.json"

runbooks:
  - id: deployment
    name: "Deploy order_executor"
    description: "Deploy the order_executor Anchor program to Surfnet"
    location: ./deployment