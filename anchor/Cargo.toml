[workspace]
members = ["programs/*"]
resolver = "2"

# Pin blake3 to 1.8.2: 1.8.3+ requires Cargo edition2024 (not yet stabilized)
[patch.crates-io]
blake3 = { git = "https://github.com/BLAKE3-team/BLAKE3", tag = "1.8.2" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
