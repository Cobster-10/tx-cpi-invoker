[package]
name = "order_executor"
version = "0.1.0"
description = "Execute user-specified CPIs when trigger conditions are met"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "order_executor"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
stork-solana-sdk = "0.0.7"

[dev-dependencies]
litesvm = "=0.7.1"
solana-sdk = "2.3"
sha2 = "0.10"
